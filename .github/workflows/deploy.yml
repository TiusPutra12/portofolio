name: Deploy Laravel to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kode
      uses: actions/checkout@v4

    - name: Setup PHP 8.3
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo, pdo_sqlite, sqlite3

    - name: Install Composer (tanpa dev)
      run: composer install --no-dev --optimize-autoloader --no-interaction
      working-directory: website

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Vite Assets (CSS & JS)
      run: |
        npm ci
        npm run build
      working-directory: website

    - name: Buat .env production (debug ON untuk melihat error)
      env:
        APP_KEY: ${{ secrets.APP_KEY }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      run: |
        cat > website/.env << ENVEOF
        APP_NAME=DevPortfolio
        APP_ENV=local
        APP_KEY=${APP_KEY}
        APP_DEBUG=true
        APP_URL=https://tportfolio.wuaze.com

        APP_LOCALE=en
        APP_FALLBACK_LOCALE=en
        APP_FAKER_LOCALE=en_US

        APP_MAINTENANCE_DRIVER=file
        BCRYPT_ROUNDS=12

        LOG_CHANNEL=single
        LOG_LEVEL=debug

        DB_CONNECTION=sqlite

        SESSION_DRIVER=file
        SESSION_LIFETIME=120
        SESSION_ENCRYPT=false
        SESSION_PATH=/
        SESSION_DOMAIN=null

        BROADCAST_CONNECTION=log
        FILESYSTEM_DISK=local
        QUEUE_CONNECTION=sync
        CACHE_STORE=file

        ADMIN_PASSWORD=${ADMIN_PASSWORD}
        ENVEOF

    - name: Buat database SQLite kosong
      run: touch website/database/database.sqlite

    - name: Siapkan struktur folder deploy
      run: |
        mkdir -p deploy_root/laravel_app
        mkdir -p deploy_root/htdocs

        # Salin semua file Laravel ke laravel_app/ (tanpa folder public/)
        rsync -a \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='public' \
          website/ deploy_root/laravel_app/

        # Salin isi public/ langsung ke htdocs/ (web root)
        rsync -a website/public/ deploy_root/htdocs/

    - name: Tulis index.php yang menunjuk ke laravel_app
      run: |
        cat > deploy_root/htdocs/index.php << 'PHPEOF'
        <?php

        use Illuminate\Foundation\Application;
        use Illuminate\Http\Request;

        define('LARAVEL_START', microtime(true));

        $appBase = dirname(__DIR__) . '/laravel_app';

        if (file_exists($maintenance = $appBase . '/storage/framework/maintenance.php')) {
            require $maintenance;
        }

        require $appBase . '/vendor/autoload.php';

        $app = require_once $appBase . '/bootstrap/app.php';

        $app->handleRequest(Request::capture());
        PHPEOF

    # dangerous-clean-slate: hapus semua file lama di hosting, upload ulang dari awal
    - name: Upload laravel_app ke hosting (CLEAN SLATE)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: laravel_app/
        local-dir: ./deploy_root/laravel_app/
        dangerous-clean-slate: true
        exclude: |
          **/.git*
          **/node_modules/**
          storage/framework/cache/data/**
          storage/framework/sessions/**
          storage/framework/views/**
          storage/logs/**

    - name: Upload htdocs ke hosting (CLEAN SLATE)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: htdocs/
        local-dir: ./deploy_root/htdocs/
        dangerous-clean-slate: true
        exclude: |
          **/.git*